name: simintech-library-curation
version: 0.1.0
description: Генерация и проверка каталога имён свойств блоков SimInTech.
requires:
  scripts:
    - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/catalog_tool.py
  data:
    - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/data/block_catalog.json
  platform: Windows
source_of_truth:
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/catalog.py
  - https://github.com/producedbysavant/simintech-code/blob/main/docs/reference/com_api_inventory.md
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/constants.py
verified: true
verified_note: >
  Отсутствие GetPropCount/GetPropName и молчаливый отказ SetBlockProp
  подтверждены картой методов COM API и проверкой на реальном SimInTech
  (SimInTech64, 2026-09-10): запись в несуществующее имя не даёт ошибки.
  Структура .xprt (custom_props, UTF-8 с BOM) установлена на реальном файле.
