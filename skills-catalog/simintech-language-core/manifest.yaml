  - https://github.com/producedbysavant/simintech-code/blob/main/language/pitfalls.md
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/constants.py
  # Справка вендора по функциям, названным в скилле: createblock, секция
  # initialization, перечень функций, доступных только в графическом
  # контейнере (createprimitiv), и таблица типов getobjtypeid.
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/obekty/createblock.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/5_klyuchevye_slova/sekcii/initialization.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/funkcii_dostupnye_tolko_v_graf_konteinere.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/obekty/getobjtypeid.html
  # Справка по функциям субмодели и обхода контейнеров, названным в скилле:
  # инжектирование скрипта (reinitsubmodel), порты субмодели, перечисление
  # объектов и подъём по уровням, удаление объекта.
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/sistemnye/reinitsubmodel.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/sistemnye/initsubmodelports.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/graficheskie/removeprimitiv.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/obekty/getsubmodelid.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/obekty/getobj.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/obekty/getownercontainer.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/obekty/submodelbypageid.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/porty_blokov_linii_svyazi/findstartport.html
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/porty_blokov_linii_svyazi/getportblockid.html
  # Справка по traceallports: одноаргументная форма, про default которой
  # говорит скилл (обход с сопряжёнными портами включён по умолчанию).
  - https://help.simintech.ru/11_yazyk_programmirovaniya/6_funkcii/3_graficheskie_i_sistemnye/porty_blokov_linii_svyazi/traceallports.html
  # Молчаливость SetPageScript: возвращает 1 и при синтаксически неверном
  # скрипте, ошибка наружу не сообщается.
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/core/script_bridge.py
  # Контур языкового слоя: пять исходов, маркеры CTX_BEGIN/CTX_END, порядок
  # доставки скрипта в секцию initialization — спецификация живёт в
  # `docs/superpowers/specs/` репозитория simintech-code и добавляется сюда,
  # когда та ветка влита: сверка путей (`test_referenced_paths_exist_in_
  # simintech_code`) требует, чтобы путь существовал в `main`, а не в ветке.
  # Пример-сценарий с численной приёмкой и падающими случаями (MCP-сервер).
  - https://github.com/producedbysavant/simintech-mcp/blob/main/docs/examples/language-contour.md
related_skills:
  # Не входит в этот каталог: скилл про экранирование кавычек в .inc
  # существует как самостоятельно установленный, здесь только ссылка.
  - simintech-inc-quoting  # внешний, не в skills-catalog/
verified: true
verified_note: >
  Синтаксис, типы и .inc — перенесено из репозитория simintech-code (ранее
  simintech-code-library); раздел про .inc подтверждён практическим опытом
  кодогенерации. Раздел о построении модели — живой замер 2026-09-28, SimInTech
  2.26.6.23: savemodeltofile отвечал и выгружал контейнер, декларативный текст,
  ветвление через точку родительской линии, отказ createblock во время
  моделирования, недоступность createprimitiv из макроса, поведение TAB,
  различие форм traceallports(port, 0) и (port, 1) — обход через границу
  контейнера. Там же измерено
  отрицательно: createmodelfromfile объектов не создал (счётчик не изменился,
  сообщений не было, причина не локализована), а createmodel живым вызовом не
  проверялся. Перечень функций, которые вендор называет для сборки схемы,
  получен по сообщению технической поддержки вендора, 2026-09-28. Второй ответ технической поддержки вендора
  (2026-09-28) уточнил контракт: порядок соседей traceallports не гарантирован
  для топологий со служебными блоками, точка ветвления отдельным объектом не
  добавляется, getparentwireid и getparentwirenodeindex вне ветвления
  возвращают 0, у типов объектов есть именованные константы (otBlock = 100 …
  otImageFrameBlock = 114, сверяются со справкой getobjtypeid), createblock
  создаёт объект по имени класса из подключённой библиотеки, а семейство
  функций текста модели вендор называет из четырёх имён, включая
  savemodeltotext, которой в поставке 2.26.6.23 мы не нашли.
  Замер 2026-09-29 (та же поставка 2.26.6.23) закрыл прежние пробелы: пять
  демонстрационных проектов вендора с createmodel и createmodelfromfile
  проходят, наш прежний отрицательный результат по createmodelfromfile
  объяснён неверным экранированием кавычек (верная форма — chr(34); удвоение
  даёт пустую строку, обратный слэш не экранирует, BOM не нужен).
  Инжектирование скрипта в субмодель работает при обязательном вызове
  reinitsubmodel после setprop(objid, "script", …): без него скрипт не
  компилируется и не исполняется. Удаление объекта (removeprimitiv) из скрипта
  работает, но следующий старт расчёта падает (access violation в mbtylib.dll;
  воспроизведено на четырёх прогонах «удаление × выгрузка»). initsubmodelports
  делает внешние порты субмодели видимыми сразу, в initialization (0 → 2).
  Внутри присвоенного скрипта floattostr(time) записи не даёт, а finalization
  не срабатывает при остановке расчёта извне. Функции обхода контейнеров
  (getobj, getownercontainer, submodelbypageid, findstartport, getportblockid,
  getfullname) прочитаны в демонстрационных проектах вендора.
  Контур языкового слоя измерен 2026-09-29 (та же поставка) и реализован
  (simintech-code PR #15 — механика: run_page_script, маркеры CTX_BEGIN/CTX_END,
  пять исходов, тела операций; simintech-code PR #16 — чтение скрипта страницы
  без запуска расчёта; simintech-mcp — инструменты). Тело, поставленное скриптом
  страницы, исполняется в секции initialization; исход различается по маркерам и
  росту модельного времени: ok, model-not-running, aborted, not-compiled,
  section-not-run. Живой прогон контура: 2 passed, затем прогон инструментов на
  поставке — сбор данных субмоделью вырос до 5459 строк, пока шёл расчёт.
  Сбор данных требует открывать и закрывать файл в теле на каждом шаге
  (дескриптор из initialization держит файл залоченным, а режимы создания и
  записи усекают файл — дописывание через seek и filesize).
  Уточнение из исходника (не замер): второй аргумент traceallports по умолчанию
  включён — в исходнике функции, полученном от технической поддержки вендора
  2026-09-28, aWithCoPorts инициализируется True и переопределяется только
  переданным аргументом; одноаргументную форму живым прогоном не звали.
  Запуск макроса в живом экземпляре проверен 2026-10-01 (та же поставка):
  рабочая форма — mmain.exe "<проект.prt>" /projmacros "<макрос.txt>", результат
  виден в окне сообщений и в stdout при запуске из командной строки; форма
  mstarter macros — запускатель (по справке вендора его назначение —
  единственный экземпляр приложения), без проектного контекста; контекст
  макроса не равен скрипту
  страницы (savemodeltofile и функции ассистентского рантайма вендора там
  отсутствуют); createprimitiv из макроса недоступна (замер 2026-09-28), а
  одиночный прогон 2026-10-01 строки ошибки не дал и объекта не показал —
  вопрос открыт. Машинная запись этого знания — вместе с обёрткой запуска
  макроса (simintech-code#13), пока провенанс прозаический.
