name: simintech-model-ir
version: 0.2.0
description: "Полная модель SimInTech вне контекста: load_model, model_ref, паспорт, точные запросы к графу, функциональное влияние, семантическое покрытие, контракты и build_and_verify с вердиктом."
requires:
  mcp_tools:
    - doctor
    - load_model
    - get_model_manifest
    - query_model
    - build_and_verify
    - simulate
  data:
    - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/data/block_contracts.json
source_of_truth:
  # Спецификация Model IR: зачем полная модель вне контекста, C1-C5.
  - https://github.com/producedbysavant/simintech-code/blob/main/docs/superpowers/specs/2026-10-28-model-ir.md
  # Свод фактов: IR, текстовый и топологический источники, граф, паспорт,
  # контракты и SystemSpec с провенансом.
  - https://github.com/producedbysavant/simintech-code/blob/main/docs/knowledge/11-model-ir.md
  # Компиляция SystemSpec и сверка фактической модели: вердикт и not_evaluated.
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/model_ir/system_spec.py
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/model_ir/verify.py
  # Реестр контрактов и портовые модели fixed/nport/portnames/submodel/unknown.
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/model_ir/contracts.py
  # Функциональная семантика: influence, semantic_coverage, known_absences.
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/model_ir/semantics.py
  - https://github.com/producedbysavant/simintech-code/blob/main/docs/superpowers/specs/2026-10-30-functional-semantics-pilot.md
  - https://github.com/producedbysavant/simintech-code/blob/main/docs/superpowers/plans/2026-10-30-functional-semantics-core.md
  # Граф: запросы, evidence, покрытие, unknown и truncated.
  - https://github.com/producedbysavant/simintech-code/blob/main/simintech_api/model_ir/graph.py
  # MCP-обёртка: model_ref, снимки, источники и query_model.
  - https://github.com/producedbysavant/simintech-mcp/blob/main/simintech_mcp/tools/model_ir.py
  - https://github.com/producedbysavant/simintech-mcp/blob/main/simintech_mcp/model_store.py
  # build_and_verify и контрактная проверка.
  - https://github.com/producedbysavant/simintech-mcp/blob/main/simintech_mcp/tools/system_spec.py
  - https://github.com/producedbysavant/simintech-mcp/blob/main/simintech_mcp/contracts.py
  # Поверхность инструментов и руководство Model IR в MCP.
  - https://github.com/producedbysavant/simintech-mcp/blob/main/docs/tool-surface.md
  - https://github.com/producedbysavant/simintech-mcp/blob/main/simintech_mcp/tool_docs.py
verified: true
verified_note: >
  Сведено 2026-10-31 по simintech-code main 669a890 (тег v0.19.0) и
  simintech-mcp main 3ad7e5f. Функциональная семантика (контракты v2,
  influence, semantic_coverage, known_absences, границы субмоделей)
  проверена unit-наборами simintech-code и MCP, включая интеграционный
  test_semantic_queries на искусственной модели; flake8, mypy (linux и
  win32), pyright strict, DLP и check_pins зелёные. Живой приёмки на Windows
  и реальной модели не было: unit/интеграционные тесты не подтверждают COM
  и SaveProjectXML на поставке. Строки pilot_blocks.yaml остаются
  preliminary до проверки владельцем. Пограничные исправления script без
  зависимостей и утверждённости known_absences ведутся отдельной веткой и в
  этот снимок не входят.
